server.port=8080
spring.application.name=turno-ya-backend
app.time-zone=${APP_TIME_ZONE:America/Argentina/Buenos_Aires}

# Datos de conexion a MySQL. En Docker se sobreescriben via variables de entorno
# (ver docker-compose.yml). Los valores por defecto sirven para correr el backend
# localmente contra un MySQL en localhost:3306.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/turnoya?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:turnoya_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:turnoya_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate crea/actualiza el esquema automaticamente a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Evita fallar al iniciar si la base todavia no esta lista (util junto al healthcheck de docker-compose).
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=-1

# Clave usada para firmar los JWT de sesion. En Docker se sobreescribe via JWT_SECRET (ver docker-compose.yml).
jwt.secret=${JWT_SECRET:cambia-esta-clave-en-produccion-por-una-larga-y-aleatoria-1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Credenciales del super administrador que se crea automaticamente al iniciar (si no existe).
superadmin.username=${SUPERADMIN_USERNAME:superadmin}
superadmin.password=${SUPERADMIN_PASSWORD:CambiarPassword123}
superadmin.correo=${SUPERADMIN_CORREO:superadmin@turnoya.local}
